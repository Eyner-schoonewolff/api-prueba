service: wompi-api
frameworkVersion: '3'

provider:
  name: aws
  runtime: nodejs20.x
  region: us-west-2
  stage: dev
  environment:
      API_URL_SUPABASE: ${{ secrets.API_URL_SUPABASE }} 
      ANON_API_KEY: ${{ secrets.ANON_API_KEY }}    
  httpApi:
    cors: true

plugins:
  - serverless-esbuild
  - serverless-offline

# package:
#   individually: true
#   include:
#     - dist/**
#   exclude:
#     - node_modules/**
#     - test/**
#     - coverage/**

functions:
  api:
    handler: dist/lambda.handler
    events:
      - httpApi:
          path: /
          method: any
      - httpApi:
          path: /{proxy+}
          method: any

custom:
  esbuild:
    bundle: true
    minify: true
    sourcemap: true
    target: node20
    platform: node
    external: [
      '@nestjs/websockets/socket-module',
      '@grpc/grpc-js',
      '@grpc/proto-loader',
      'kafkajs',
      'mqtt',
      'nats',
      'ioredis',
      'amqplib',
      'amqp-connection-manager'
    ]
    packager: npm
    exclude: [] 
    keepOutputDirectory: true